name: Release

on:
  push:
    tags:
      - '*'

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      firefox-guid: ${{ steps.read-guid.outputs.guid }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: corepack enable
      - run: yarn install --immutable
      - name: Set version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - run: yarn workspace @devtoolster/extension build
      - run: yarn workspace @devtoolster/extension zip
      - run: yarn workspace @devtoolster/extension zip:firefox
      - name: Read Firefox GUID from manifest
        id: read-guid
        run: |
          guid=$(jq -r '.browser_specific_settings.gecko.id' extension/.output/firefox-mv3/manifest.json)
          echo "guid=$guid" >> "$GITHUB_OUTPUT"
      - run: mkdir -p zips && cp extension/.output/devtoolsterextension-*.zip zips/
      - uses: actions/upload-artifact@v4
        with:
          name: extension-zips
          path: zips/

  publish-chrome:
    needs: build
    runs-on: ubuntu-latest
    environment: chrome
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: extension-zips
          path: zips
      - name: Identify Chrome zip
        id: chrome-zip
        run: |
          zip=$(ls zips/*-chrome.zip)
          echo "path=$zip" >> "$GITHUB_OUTPUT"
      - uses: wdzeng/chrome-extension@v2
        with:
          extension-id: ${{ secrets.CHROME_EXTENSION_ID }}
          zip-path: ${{ steps.chrome-zip.outputs.path }}
          publisher-id: ${{ secrets.CHROME_PUBLISHER_ID }}
          client-id: ${{ secrets.CHROME_CLIENT_ID }}
          client-secret: ${{ secrets.CHROME_CLIENT_SECRET }}
          refresh-token: ${{ secrets.CHROME_REFRESH_TOKEN }}

  publish-firefox:
    needs: build
    runs-on: ubuntu-latest
    environment: firefox
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: extension-zips
          path: zips
      - name: Identify Firefox and source zips
        id: ff-zip
        run: |
          xpi=$(ls zips/*-firefox.zip)
          src=$(ls zips/*-sources.zip)
          echo "xpi-path=$xpi" >> "$GITHUB_OUTPUT"
          echo "source-path=$src" >> "$GITHUB_OUTPUT"
      - uses: wdzeng/firefox-addon@v1
        with:
          addon-guid: ${{ needs.build.outputs.firefox-guid }}
          xpi-path: ${{ steps.ff-zip.outputs.xpi-path }}
          source-file-path: ${{ steps.ff-zip.outputs.source-path }}
          license: MIT
          jwt-issuer: ${{ secrets.FIREFOX_JWT_ISSUER }}
          jwt-secret: ${{ secrets.FIREFOX_JWT_SECRET }}
