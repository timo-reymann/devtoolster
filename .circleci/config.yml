version: '2.1'

only_tags: &only_tags
  filters:
    branches:
      ignore: /.*/
    tags:
      only: /.*/

orbs:
  node: circleci/node@5.3.0
  semantic-release: trustedshops-public/semantic-release@6.1.0

executors:
  node:
    docker:
      - image: cimg/node:22.14

commands:
  install-deps:
    steps:
      - restore_cache:
          key: yarn-v4-{{ checksum "yarn.lock" }}
      - run:
          name: Install dependencies
          command: yarn install --immutable
      - save_cache:
          key: yarn-v4-{{ checksum "yarn.lock" }}
          paths:
            - .yarn/cache
            - node_modules

jobs:
  build-and-typecheck:
    executor: node
    steps:
      - checkout
      - install-deps
      - run:
          name: Typecheck web-api
          command: yarn workspace @devtoolster/web-api typecheck
      - run:
          name: Svelte check extension
          command: yarn workspace @devtoolster/extension compile
      - run:
          name: Build extension
          command: yarn workspace @devtoolster/extension build
      - run:
          name: Build web-api
          command: yarn workspace @devtoolster/web-api build
      - run:
          name: Build demo
          command: yarn workspace @devtoolster/demo build
      - persist_to_workspace:
          root: .
          paths:
            - extension/.output
            - web-api/dist
            - application/dist

  zip-extension:
    executor: node
    steps:
      - checkout
      - install-deps
      - run:
          name: Build extension
          command: yarn workspace @devtoolster/extension build
      - run:
          name: Zip extension (Chrome)
          command: yarn workspace @devtoolster/extension zip
      - run:
          name: Zip extension (Firefox)
          command: yarn workspace @devtoolster/extension zip:firefox
      - store_artifacts:
          path: extension/.output
      - persist_to_workspace:
          root: .
          paths:
            - extension/.output/*.zip

workflows:
  version: 2
  main:
    jobs:
      - build-and-typecheck
      - semantic-release/with_existing_config:
          name: semantic-release
          requires:
            - build-and-typecheck
          context:
            - semantic-release
          filters:
            branches:
              only:
                - main

  release:
    jobs:
      - build-and-typecheck:
          <<: *only_tags
      - zip-extension:
          <<: *only_tags
          requires:
            - build-and-typecheck
